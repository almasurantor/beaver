<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#5B21B6" />
    <title>Beaver Smash — Offline</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#5b21b6;font-family:system-ui,-apple-system,sans-serif}body{display:grid;min-height:100dvh;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));color:#111827}.card{width:min(100%,420px);border-radius:28px;background:#fff;padding:32px;text-align:center;box-shadow:0 24px 70px #2e106580}.icon{width:96px;height:96px;border-radius:24px}.eyebrow{margin:20px 0 4px;color:#7c3aed;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;font-size:32px}p{margin:12px 0 24px;color:#4b5563;line-height:1.6}button{min-height:48px;border:0;border-radius:14px;background:#7c3aed;padding:0 24px;color:#fff;font:inherit;font-weight:800}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="" />
      <div class="eyebrow">Beaver Smash</div>
      <h1>You&apos;re offline</h1>
      <p>Beaver Smash needs an internet connection to show live matches, rankings, and challenges.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
